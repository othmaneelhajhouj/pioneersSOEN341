# Organizer Testing Pipeline - GitHub Actions Workflow
# Runs automated tests for organizer functionality on push and pull requests

name: Organizer Tests

on:
  push:
    branches: [ main, Renato ]
    paths:
      - 'app/**'
      - 'Docker/**'
      - '.github/workflows/test-organizer.yml'
  pull_request:
    branches: [ main, Renato ]
    paths:
      - 'app/**'
      - 'Docker/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Run Organizer Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.1'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      
      - name: Install dependencies
        working-directory: ./app
        run: npm ci
      
      - name: Create .env file
        working-directory: ./app
        run: |
          echo "DATABASE_URL=file:./prisma/dev.db" >> .env
          echo "TEST_DATABASE_URL=file:./prisma/test.db" >> .env
          echo "NODE_ENV=test" >> .env
      
      - name: Generate Prisma Client
        working-directory: ./app
        run: npm run prisma:generate
      
      - name: Run database migrations
        working-directory: ./app
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./prisma/test.db
      
      - name: Build TypeScript
        working-directory: ./app
        run: npm run build
      
      - name: Run all tests with coverage
        working-directory: ./app
        run: npm run test:coverage -- --selectProjects=organizer-tests --runInBand

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/coverage/
            app/__tests__/
          retention-days: 30
      
      - name: Comment PR with coverage results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const coveragePath = path.join(process.cwd(), 'app', 'coverage', 'coverage-summary.json');
            
            console.log('Looking for coverage at:', coveragePath);
            console.log('Current directory:', process.cwd());
            console.log('Directory contents:', fs.readdirSync('app/coverage').join(', '));
            
            if (!fs.existsSync(coveragePath)) {
              console.log('Coverage summary file not found');
              return;
            }
            
            const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
            const summary = coverage.total;
            
            const comment = `##   Test Results\n\n` +
              `**Coverage Summary:**\n` +
              `- **Lines:** ${summary.lines.pct}%\n` +
              `- **Statements:** ${summary.statements.pct}%\n` +
              `- **Functions:** ${summary.functions.pct}%\n` +
              `- **Branches:** ${summary.branches.pct}%\n\n` +
              `  Tests completed with coverage report!`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      
      - name: Install dependencies
        working-directory: ./app
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: ./app
        run: npm run prisma:generate
      
      - name: Build TypeScript
        working-directory: ./app
        run: npm run build
